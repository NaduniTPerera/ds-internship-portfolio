[project]
name = "ds-intern"
version = "0.1.0"
description = "Data science internship portfolio - NYC Taxi data warehouse and analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.2.4",
    "duckdb==2.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "ipykernel==7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_intern", "src/ingest", "src/benchmark"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
