# PostgreSQL 16 warehouse for the NYC Taxi project.
#
# Start (run from the repo root):
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
# Stop (data is kept in the named volume):
#   docker compose --env-file .env -f docker/docker-compose.yml down

name: ds-intern

services:
  postgres:
    image: postgres:16
    container_name: nyc_taxi_pg
    restart: unless-stopped

    # Docker's default /dev/shm is 64 MB, too small for VACUUM / parallel queries
    # on millions of rows ("could not resize shared memory segment").
    shm_size: 256mb

    # Credentials come from .env (never committed). See .env.example.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # host port -> container port. Postgres inside the container always uses 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    # Named volume: data survives container restarts and re-creation.
    volumes:
      - pgdata:/var/lib/postgresql/data

    # Healthcheck: the container is "healthy" only once Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
